<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vistoria Hídrica INEA</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
    }
    .container { max-width: 800px; margin: 0 auto; padding: 1rem; }
    .header { 
      background: linear-gradient(135deg, #0066cc, #004499);
      color: white;
      padding: 2rem;
      border-radius: 8px;
      margin-bottom: 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .header h1 { margin: 0; font-size: 28px; }
    .header p { margin: 0.5rem 0 0 0; opacity: 0.9; }
    .main { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .tabs { display: flex; gap: 8px; border-bottom: 2px solid #eee; margin-bottom: 2rem; overflow-x: auto; }
    .tab-btn { 
      padding: 12px 16px; 
      border: none; 
      background: transparent; 
      cursor: pointer; 
      font-size: 14px;
      font-weight: 500;
      color: #666;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: #0066cc; }
    .tab-btn.active { 
      color: #0066cc; 
      border-bottom-color: #0066cc;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group:last-child { margin-bottom: 0; }
    label {
      display: block;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: #333;
      font-size: 14px;
    }
    .required { color: #e74c3c; }
    input[type="text"], 
    input[type="date"], 
    textarea, 
    select { 
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      transition: border 0.2s;
    }
    input[type="text"]:focus, 
    input[type="date"]:focus, 
    textarea:focus, 
    select:focus {
      outline: none;
      border-color: #0066cc;
      box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
    }
    textarea { 
      resize: vertical; 
      min-height: 80px;
    }
    .pill-group {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 1.5rem;
    }
    .pill-group.grid-2 {
      grid-template-columns: repeat(2, 1fr);
    }
    .pill-group.grid-3 {
      grid-template-columns: repeat(3, 1fr);
    }
    .pill {
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .pill:hover {
      border-color: #0066cc;
      color: #0066cc;
    }
    .pill.active {
      background: #0066cc;
      color: white;
      border-color: #0066cc;
    }
    .file-upload {
      border: 2px dashed #ddd;
      border-radius: 4px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #fafafa;
    }
    .file-upload:hover {
      border-color: #0066cc;
      background: #f0f7ff;
    }
    .file-upload input[type="file"] {
      display: none;
    }
    .file-list {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .file-item {
      background: #f0f7ff;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .file-item button {
      background: none;
      border: none;
      color: #e74c3c;
      cursor: pointer;
      font-weight: bold;
      padding: 0;
    }
    .figura-card {
      background: #f9f9f9;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      position: relative;
    }
    .figura-card .header-figura {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .figura-card h4 {
      margin: 0;
      color: #333;
      font-size: 16px;
    }
    .figura-card .btn-remover {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .figura-card .btn-remover:hover {
      background: #c0392b;
    }
    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 2rem;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #0066cc;
      color: white;
    }
    .btn-primary:hover {
      background: #0052a3;
    }
    .btn-secondary {
      background: #eee;
      color: #333;
    }
    .btn-secondary:hover {
      background: #ddd;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .progress-bar {
      width: 100%;
      height: 4px;
      background: #eee;
      border-radius: 2px;
      margin-bottom: 2rem;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #0066cc;
      width: 0%;
      transition: width 0.3s;
    }
    .alert {
      padding: 1rem;
      border-radius: 4px;
      margin-top: 1rem;
      display: none;
      animation: slideIn 0.3s ease;
    }
    .alert.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .alert.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .alert.show { display: block; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🏗️ Vistoria Hídrica INEA</h1>
      <p>Sistema de coleta de dados para infraestrutura hídrica</p>
    </div>

    <div class="main">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(0)">📋 Contexto</button>
        <button class="tab-btn" onclick="switchTab(1)">📍 Identificação</button>
        <button class="tab-btn" onclick="switchTab(2)">⚠️ Avaliação</button>
        <button class="tab-btn" onclick="switchTab(3)">📷 Figuras</button>
        <button class="tab-btn" onclick="switchTab(4)">✅ Conclusão</button>
        <button class="tab-btn" onclick="switchTab(5)">👤 Responsável</button>
      </div>

      <!-- TAB 0: CONTEXTO -->
      <div class="tab-content active">
        <div class="form-group">
          <label>O que motivou esta vistoria? <span class="required">*</span></label>
          <div class="pill-group">
            <button class="pill" onclick="selectPill(this, 'motivo', 'Solicitação SEI')">Solicitação SEI</button>
            <button class="pill" onclick="selectPill(this, 'motivo', 'Ordem de Serviço')">Ordem de Serviço</button>
            <button class="pill" onclick="selectPill(this, 'motivo', 'Solicitação da Diretoria')">Solicitação da Diretoria</button>
            <button class="pill" onclick="selectPill(this, 'motivo', 'Outro')">Outro</button>
          </div>
          <input type="text" id="motivo_outro" placeholder="Especificar outro motivo" style="display: none;">
        </div>

        <div class="form-group">
          <label>Número do processo SEI</label>
          <input type="text" id="numero_sei" placeholder="Ex: 070002/005517/2022">
        </div>

        <div class="form-group">
          <label>Número da Ordem de Serviço</label>
          <input type="text" id="numero_os" placeholder="Ex: OS-2024-001">
        </div>

        <div class="form-group">
          <label>Contexto adicional ou justificativa</label>
          <textarea id="contexto_detalhado" placeholder="Investigação de erosão / Avaliação pós-chuva..."></textarea>
        </div>
      </div>

      <!-- TAB 1: IDENTIFICAÇÃO -->
      <div class="tab-content">
        <div class="form-group">
          <label>Data da vistoria <span class="required">*</span></label>
          <input type="date" id="data_vistoria">
        </div>

        <div class="form-group">
          <label>Tipo de infraestrutura <span class="required">*</span></label>
          <div class="pill-group">
            <button class="pill" onclick="selectPill(this, 'tipo', 'Canalização')">Canalização</button>
            <button class="pill" onclick="selectPill(this, 'tipo', 'Curso hídrico')">Curso hídrico</button>
            <button class="pill" onclick="selectPill(this, 'tipo', 'Barragem')">Barragem</button>
            <button class="pill" onclick="selectPill(this, 'tipo', 'Contenção')">Contenção</button>
            <button class="pill" onclick="selectPill(this, 'tipo', 'Comporta')">Comporta</button>
            <button class="pill" onclick="selectPill(this, 'tipo', 'Outro')">Outro</button>
          </div>
          <input type="text" id="tipo_outro" placeholder="Especificar tipo" style="display: none;">
        </div>

        <div class="form-group">
          <label>Nome/localização do local vistoriado <span class="required">*</span></label>
          <textarea id="localizacao" placeholder="Ex: Rio Piabanha, entre Avenida... e Rua..."></textarea>
        </div>

        <div class="form-group">
          <label>Coordenadas geográficas (SIRGAS 2000 - Zona 23K)</label>
          <input type="text" id="coordenadas" placeholder="Ex: E: 12345678 N: 7654321">
        </div>
      </div>

      <!-- TAB 2: AVALIAÇÃO -->
      <div class="tab-content">
        <div class="form-group">
          <label>Nível de risco geral <span class="required">*</span></label>
          <div class="pill-group grid-3">
            <button class="pill" onclick="selectPill(this, 'risco', 'Baixo')">Baixo</button>
            <button class="pill" onclick="selectPill(this, 'risco', 'Médio')">Médio</button>
            <button class="pill" onclick="selectPill(this, 'risco', 'Alto')">Alto</button>
          </div>
        </div>

        <div class="form-group">
          <label>Prazo para realização do projeto <span class="required">*</span></label>
          <div class="pill-group">
            <button class="pill" onclick="selectPill(this, 'prazo', 'Imediato (até 30 dias)')">Imediato (até 30 dias)</button>
            <button class="pill" onclick="selectPill(this, 'prazo', 'Curto prazo (até 3 meses)')">Curto prazo (até 3 meses)</button>
            <button class="pill" onclick="selectPill(this, 'prazo', 'Médio prazo (até 1 ano)')">Médio prazo (até 1 ano)</button>
            <button class="pill" onclick="selectPill(this, 'prazo', 'Monitoramento')">Monitoramento</button>
          </div>
        </div>
      </div>

      <!-- TAB 3: FIGURAS -->
      <div class="tab-content">
        <div class="form-group">
          <label>Upload de imagens</label>
          <div class="file-upload" onclick="document.getElementById('imagens').click()">
            <div>📸 Clique ou arraste imagens aqui</div>
            <div style="font-size: 12px; color: #999; margin-top: 0.5rem;">PNG, JPG, GIF</div>
            <input type="file" id="imagens" multiple accept="image/*" onchange="handleFiles(event)">
          </div>
          <div class="file-list" id="fileList"></div>
        </div>

        <div class="form-group">
          <label>Análise individual de cada figura</label>
          <div id="figurasContainer"></div>
          <button type="button" class="btn-secondary" style="margin-top: 1rem;" onclick="adicionarFigura()">➕ Adicionar Nova Figura</button>
        </div>
      </div>

      <!-- TAB 4: CONCLUSÃO -->
      <div class="tab-content">
        <div class="form-group">
          <label>Conclusão geral da vistoria</label>
          <textarea id="conclusao_geral" placeholder="Síntese geral dos achados..."></textarea>
        </div>

        <div class="form-group">
          <label>Recomendações e prazos globais</label>
          <textarea id="recomendacoes_globais" placeholder="Ações prioritárias, cronograma..."></textarea>
        </div>
      </div>

      <!-- TAB 5: RESPONSÁVEL -->
      <div class="tab-content">
        <div class="form-group">
          <label>Quem é o responsável? <span class="required">*</span></label>
          <div class="pill-group">
            <button class="pill" onclick="selectResponsavel('erick')">Erick Santana Amâncio</button>
            <button class="pill" onclick="selectResponsavel('outro')">Outro profissional</button>
          </div>
        </div>

        <div class="form-group">
          <label>Nome completo <span class="required">*</span></label>
          <input type="text" id="engenheiro_nome" value="Erick Santana Amâncio">
        </div>

        <div class="form-group">
          <label>Formação/profissão <span class="required">*</span></label>
          <input type="text" id="engenheiro_formacao" value="Engenheiro Civil">
        </div>

        <div class="form-group">
          <label>CREA <span class="required">*</span></label>
          <input type="text" id="engenheiro_crea" value="CREA-RJ - 2013138619">
        </div>
      </div>

      <div class="button-group">
        <button class="btn-secondary" onclick="salvarRascunho()">💾 Salvar Rascunho</button>
        <button class="btn-primary" onclick="gerarRelatorio()">📥 Gerar Relatório Word</button>
      </div>

      <div class="alert" id="alertBox"></div>
    </div>
  </div>

  <!-- Carregando docx via importmap -->
  <script type="importmap">
    {
      "imports": {
        "docx": "https://cdn.jsdelivr.net/npm/docx@8.5.0/+esm"
      }
    }
  </script>

  <script type="module">
    import { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, HeadingLevel, AlignmentType, WidthType, BorderStyle } from 'docx';
    
    // Exportar funções globais
    window.docxLib = { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, HeadingLevel, AlignmentType, WidthType, BorderStyle };

    const formData = {};
    let uploadedFiles = [];
    let figuras = [];
    let contador_figuras = 0;

    window.switchTab = function(index) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-content')[index].classList.add('active');
      document.querySelectorAll('.tab-btn')[index].classList.add('active');
      updateProgress();
    };

    window.selectPill = function(element, field, value) {
      const parent = element.parentElement;
      parent.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      element.classList.add('active');
      formData[field] = value;

      if (field === 'motivo' && value === 'Outro') {
        document.getElementById('motivo_outro').style.display = 'block';
      } else if (field === 'motivo') {
        document.getElementById('motivo_outro').style.display = 'none';
      }

      if (field === 'tipo' && value === 'Outro') {
        document.getElementById('tipo_outro').style.display = 'block';
      } else if (field === 'tipo') {
        document.getElementById('tipo_outro').style.display = 'none';
      }

      updateProgress();
    };

    window.selectResponsavel = function(choice) {
      const pills = document.querySelectorAll('.tab-content')[5].querySelectorAll('.pill');
      pills.forEach(p => p.classList.remove('active'));
      event.target.classList.add('active');

      if (choice === 'erick') {
        document.getElementById('engenheiro_nome').value = 'Erick Santana Amâncio';
        document.getElementById('engenheiro_formacao').value = 'Engenheiro Civil';
        document.getElementById('engenheiro_crea').value = 'CREA-RJ - 2013138619';
      } else {
        document.getElementById('engenheiro_nome').value = '';
        document.getElementById('engenheiro_formacao').value = '';
        document.getElementById('engenheiro_crea').value = '';
      }
      updateProgress();
    };

    window.handleFiles = function(event) {
      uploadedFiles = Array.from(event.target.files);
      const fileList = document.getElementById('fileList');
      fileList.innerHTML = '';

      uploadedFiles.forEach((file, idx) => {
        const item = document.createElement('div');
        item.className = 'file-item';
        item.innerHTML = `
          <span>${file.name}</span>
          <button onclick="removeFile(${idx})">✕</button>
        `;
        fileList.appendChild(item);
      });
      updateProgress();
    };

    window.removeFile = function(idx) {
      uploadedFiles.splice(idx, 1);
      document.getElementById('imagens').value = '';
      handleFiles({target: {files: uploadedFiles}});
    };

    window.adicionarFigura = function() {
      contador_figuras++;
      const figuraId = `figura_${contador_figuras}`;
      
      const container = document.getElementById('figurasContainer');
      const figuraCard = document.createElement('div');
      figuraCard.className = 'figura-card';
      figuraCard.id = figuraId;
      figuraCard.innerHTML = `
        <div class="header-figura">
          <h4>Figura ${contador_figuras}</h4>
          <button type="button" class="btn-remover" onclick="removerFigura('${figuraId}')">✕ Remover</button>
        </div>
        
        <div class="form-group">
          <label>Nome da imagem</label>
          <input type="text" class="figura-nome" placeholder="Ex: Planta de Localização" onchange="updateProgress()">
        </div>

        <div class="form-group">
          <label>Título/descrição breve</label>
          <input type="text" class="figura-titulo" placeholder="Ex: Mapa de delimitação da área vistoriada" onchange="updateProgress()">
        </div>

        <div class="form-group">
          <label>Problemas encontrados</label>
          <textarea class="figura-problemas" placeholder="Descrever anomalias, danos, erosão, etc." onchange="updateProgress()"></textarea>
        </div>

        <div class="form-group">
          <label>Estado estrutural</label>
          <div class="pill-group grid-3">
            <button type="button" class="pill" onclick="selectFiguraPill(this, '${figuraId}', 'estado', 'Bom')">Bom</button>
            <button type="button" class="pill" onclick="selectFiguraPill(this, '${figuraId}', 'estado', 'Regular')">Regular</button>
            <button type="button" class="pill" onclick="selectFiguraPill(this, '${figuraId}', 'estado', 'Crítico')">Crítico</button>
          </div>
        </div>

        <div class="form-group">
          <label>Recomendações para esta figura</label>
          <textarea class="figura-recomendacoes" placeholder="Ações necessárias para esta figura" onchange="updateProgress()"></textarea>
        </div>
      `;
      
      container.appendChild(figuraCard);
      updateProgress();
    };

    window.removerFigura = function(figuraId) {
      document.getElementById(figuraId).remove();
      updateProgress();
    };

    window.selectFiguraPill = function(element, figuraId, field, value) {
      const parent = element.parentElement;
      parent.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      element.classList.add('active');
      updateProgress();
    };

    function coletarFiguras() {
      const figurasColetadas = [];
      const cards = document.querySelectorAll('.figura-card');
      
      cards.forEach((card, idx) => {
        const nome = card.querySelector('.figura-nome').value;
        const titulo = card.querySelector('.figura-titulo').value;
        const problemas = card.querySelector('.figura-problemas').value;
        const estado = card.querySelector('.pill.active')?.textContent || '';
        const recomendacoes = card.querySelector('.figura-recomendacoes').value;
        
        if (nome || titulo || problemas || estado || recomendacoes) {
          figurasColetadas.push({
            numero: idx + 1,
            nome: nome,
            titulo: titulo,
            problemas: problemas,
            estado: estado.trim(),
            recomendacoes: recomendacoes
          });
        }
      });
      
      return figurasColetadas;
    }

    function updateProgress() {
      const required = ['data_vistoria', 'localizacao', 'tipo', 'risco', 'prazo', 'engenheiro_nome'];
      const filled = required.filter(field => {
        if (field === 'tipo' || field === 'risco' || field === 'prazo') {
          return formData[field];
        }
        return document.getElementById(field)?.value?.trim();
      }).length;

      const progress = Math.round((filled / required.length) * 100);
      document.getElementById('progressFill').style.width = progress + '%';
    }

    window.salvarRascunho = function() {
      const figurasColetadas = coletarFiguras();
      const dados = {
        motivo: formData.motivo,
        numero_sei: document.getElementById('numero_sei').value,
        numero_os: document.getElementById('numero_os').value,
        data_vistoria: document.getElementById('data_vistoria').value,
        tipo: formData.tipo,
        localizacao: document.getElementById('localizacao').value,
        coordenadas: document.getElementById('coordenadas').value,
        risco: formData.risco,
        prazo: formData.prazo,
        contexto: document.getElementById('contexto_detalhado').value,
        figuras: figurasColetadas,
        conclusao: document.getElementById('conclusao_geral').value,
        recomendacoes: document.getElementById('recomendacoes_globais').value,
        engenheiro_nome: document.getElementById('engenheiro_nome').value,
        engenheiro_crea: document.getElementById('engenheiro_crea').value,
      };

      localStorage.setItem('vistoria_draft', JSON.stringify(dados));
      showAlert('✓ Rascunho salvo com sucesso!', 'success');
    };

    window.gerarRelatorio = function() {
      const data_vistoria = document.getElementById('data_vistoria').value;
      const localizacao = document.getElementById('localizacao').value;
      const tipo = formData.tipo;
      const risco = formData.risco;

      if (!data_vistoria || !localizacao) {
        showAlert('❌ Preencha os campos obrigatórios: Data e Localização', 'error');
        return;
      }

      try {
        const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, HeadingLevel, AlignmentType, WidthType, BorderStyle } = window.docxLib;
        const figurasColetadas = coletarFiguras();
        
        // Construir texto de análise de figuras
        let analiseFiguras = '';
        figurasColetadas.forEach(fig => {
          analiseFiguras += `\n\nFIGURA ${fig.numero} - ${fig.nome}\n`;
          analiseFiguras += `Título: ${fig.titulo}\n`;
          analiseFiguras += `Problemas encontrados: ${fig.problemas}\n`;
          analiseFiguras += `Estado estrutural: ${fig.estado}\n`;
          analiseFiguras += `Recomendações: ${fig.recomendacoes}`;
        });

        // Construir texto de introdução
        let textoIntroducao = `O presente relatório foi elaborado pelo Consórcio Apoio Técnico DIRRAM, em conformidade com o Contrato nº 35/2022, vinculado ao processo administrativo SEI nº 070002/005517/2022`;
        
        if (formData.motivo) {
          textoIntroducao += `, ${formData.motivo.toLowerCase()}`;
        }
        
        if (document.getElementById('numero_sei').value) {
          textoIntroducao += ` (SEI: ${document.getElementById('numero_sei').value})`;
        }
        
        if (document.getElementById('numero_os').value) {
          textoIntroducao += ` (OS: ${document.getElementById('numero_os').value})`;
        }
        
        textoIntroducao += '.';
        
        if (document.getElementById('contexto_detalhado').value) {
          textoIntroducao += `\n\n${document.getElementById('contexto_detalhado').value}`;
        }
        
        const doc = new Document({
          sections: [{
            properties: { page: { margin: { top: 1440, right: 1440, bottom: 1440, left: 1440 } } },
            children: [
              new Paragraph({ text: "RELATÓRIO DE VISTORIA", heading: HeadingLevel.HEADING_1, alignment: AlignmentType.CENTER, spacing: { after: 200 } }),
              new Paragraph({ text: tipo || "Infraestrutura Hídrica", alignment: AlignmentType.CENTER, spacing: { after: 400 } }),
              new Paragraph({ text: localizacao, alignment: AlignmentType.CENTER, spacing: { after: 600 } }),

              new Paragraph({ text: "ÍNDICE", heading: HeadingLevel.HEADING_1, spacing: { after: 200 } }),
              new Paragraph({ text: "1. INTRODUÇÃO", spacing: { after: 100 } }),
              new Paragraph({ text: "2. VISTORIA TÉCNICA", spacing: { after: 100 } }),
              new Paragraph({ text: "3. CONCLUSÃO", spacing: { after: 400 } }),

              new Paragraph({ text: "", pageBreakBefore: true }),

              new Paragraph({ text: "1. INTRODUÇÃO", heading: HeadingLevel.HEADING_1, spacing: { after: 200 } }),
              new Paragraph({ text: textoIntroducao, spacing: { after: 400 } }),

              new Paragraph({ text: "Informações da Vistoria", heading: HeadingLevel.HEADING_2, spacing: { after: 200 } }),

              new Table({
                width: { size: 9360, type: WidthType.DXA },
                rows: [
                  new TableRow({
                    children: [
                      new TableCell({ borders: { top: { style: BorderStyle.SINGLE }, bottom: { style: BorderStyle.SINGLE }, left: { style: BorderStyle.SINGLE }, right: { style: BorderStyle.SINGLE } }, shading: { fill: "D5E8F0", type: "clear" }, children: [new Paragraph({ children: [new TextRun({ text: "Data", bold: true })] })] }),
                      new TableCell({ borders: { top: { style: BorderStyle.SINGLE }, bottom: { style: BorderStyle.SINGLE }, left: { style: BorderStyle.SINGLE }, right: { style: BorderStyle.SINGLE } }, children: [new Paragraph({ text: data_vistoria })] })
                    ]
                  }),
                  new TableRow({
                    children: [
                      new TableCell({ borders: { top: { style: BorderStyle.SINGLE }, bottom: { style: BorderStyle.SINGLE }, left: { style: BorderStyle.SINGLE }, right: { style: BorderStyle.SINGLE } }, shading: { fill: "D5E8F0", type: "clear" }, children: [new Paragraph({ children: [new TextRun({ text: "Tipo", bold: true })] })] }),
                      new TableCell({ borders: { top: { style: BorderStyle.SINGLE }, bottom: { style: BorderStyle.SINGLE }, left: { style: BorderStyle.SINGLE }, right: { style: BorderStyle.SINGLE } }, children: [new Paragraph({ text: tipo || "Não especificado" })] })
                    ]
                  }),
                  new TableRow({
                    children: [
                      new TableCell({ borders: { top: { style: BorderStyle.SINGLE }, bottom: { style: BorderStyle.SINGLE }, left: { style: BorderStyle.SINGLE }, right: { style: BorderStyle.SINGLE } }, shading: { fill: "D5E8F0", type: "clear" }, children: [new Paragraph({ children: [new TextRun({ text: "Risco", bold: true })] })] }),
                      new TableCell({ borders: { top: { style: BorderStyle.SINGLE }, bottom: { style: BorderStyle.SINGLE }, left: { style: BorderStyle.SINGLE }, right: { style: BorderStyle.SINGLE } }, children: [new Paragraph({ text: risco || "Não especificado" })] })
                    ]
                  })
                ]
              }),

              new Paragraph({ text: "", spacing: { after: 400 } }),
              new Paragraph({ text: "", pageBreakBefore: true }),

              new Paragraph({ text: "2. VISTORIA TÉCNICA", heading: HeadingLevel.HEADING_1, spacing: { after: 200 } }),
              new Paragraph({ text: "Análise de Figuras", heading: HeadingLevel.HEADING_2, spacing: { after: 200 } }),
              new Paragraph({ text: analiseFiguras || "Figuras foram analisadas conforme descrito acima.", spacing: { after: 400 } }),

              new Paragraph({ text: "", pageBreakBefore: true }),

              new Paragraph({ text: "3. CONCLUSÃO", heading: HeadingLevel.HEADING_1, spacing: { after: 200 } }),
              new Paragraph({ text: document.getElementById('conclusao_geral').value || "A vistoria foi realizada conforme planejado.", spacing: { after: 400 } }),

              new Paragraph({ text: "Recomendações", heading: HeadingLevel.HEADING_2, spacing: { after: 200 } }),
              new Paragraph({ text: document.getElementById('recomendacoes_globais').value || "As recomendações foram delineadas conforme análise.", spacing: { after: 600 } }),

              new Paragraph({ text: "", spacing: { after: 400 } }),
              new Paragraph({ text: new Date().toLocaleDateString('pt-BR'), spacing: { after: 600 } }),
              new Paragraph({ text: "_".repeat(50), spacing: { after: 100 } }),
              new Paragraph({ text: document.getElementById('engenheiro_nome').value || "Erick Santana Amâncio", spacing: { after: 50 } }),
              new Paragraph({ text: document.getElementById('engenheiro_formacao').value || "Engenheiro Civil", spacing: { after: 50 } }),
              new Paragraph({ text: document.getElementById('engenheiro_crea').value || "CREA-RJ - 2013138619" })
            ]
          }]
        });

        Packer.toBlob(doc).then(blob => {
          const url = window.URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `RELATORIO_VISTORIA_${data_vistoria}.docx`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          window.URL.revokeObjectURL(url);
          showAlert('✓ Relatório gerado com sucesso! Download iniciado.', 'success');
        });
      } catch (error) {
        console.error('Erro detalhado:', error);
        showAlert('❌ Erro ao gerar relatório: ' + error.message, 'error');
      }
    };

    function showAlert(message, type) {
      const box = document.getElementById('alertBox');
      box.textContent = message;
      box.className = 'alert ' + type + ' show';
      setTimeout(() => box.classList.remove('show'), 5000);
    }

    window.updateProgress = updateProgress;

    window.onload = () => {
      adicionarFigura();
    };
  </script>
</body>
</html>
